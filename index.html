<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Player de Vídeo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- HLS.js (necessário para links .m3u8) -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        body {
            margin: 0;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        video {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>

<video id="video" controls autoplay></video>

<script>
    // 🔗 COLOQUE SEU LINK AQUI
    var videoLink = "https://download944.mediafire.com/8an3do7x0hcg2uaVaA1T3MRiPdzYz75EFgIyhpTJ8gSi0LZhaEYhCkc_7WvNSXyDV6fzh8Nb_2Vv_5MrXrbroDDBCKFmU75d-Cpc6u5-bbVz36OXNN_fv_EN_H2CuSTDsdQgrDHG1R3x2ZfBR6pDZ5igWzqJP2GVyRk0YE6UXA1nLHow/ut3q3s1jdq2tws3/2026-01-15+18-21-56.mp4";

    var video = document.getElementById('video');

    if (videoLink.endsWith(".m3u8")) {
        if (Hls.isSupported()) {
            var hls = new Hls();
            hls.loadSource(videoLink);
            hls.attachMedia(video);
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoLink;
        }
    } else {
        video.src = videoLink;
    }
</script>

</body>
</html>
